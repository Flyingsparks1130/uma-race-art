name: Build verified Uma artwork library
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-art.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify exact original image files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64,json,zlib,subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          if subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()!='a8174df6d04b7b16114cb0ef11c1c730b6755351':raise RuntimeError('Repository changed; inspect before applying')
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for name,content in files.items():
              dest=(root/name).resolve()
              if not dest.is_relative_to(root) or name.startswith(('.git/','.github/')):raise RuntimeError('Unsafe source path')
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(content,encoding='utf8',newline='\n')
          subprocess.run(['python','scripts/sync.py','restore'],check=True)
          subprocess.run(['python','scripts/validate.py'],check=True)
          subprocess.run(['node','tests/resolve.cjs'],check=True)
          subprocess.run(['git','add','--',*files.keys(),'assets'],check=True)
          subprocess.run(['git','commit','-m','Add 272 exact outfit images with provenance and quality validation'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
